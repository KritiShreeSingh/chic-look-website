<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>W4 Classwork 2</title>
</head>
<body>
  <section>
    <h2>Simple Adder</h2>
    <input id="num1" type="number" placeholder="number">
    <input id="num2" type="number" placeholder="number">
    <button id="sumBtn" type="button">Display Sum</button>
    <p id="result"></p>
  </section>

  <hr>

  <section>
    <h2>Marks Calculator</h2>
    <p>Enter marks for eight subjects to calculate total marks:</p>
    <input type="number" id="sub1" placeholder="Subject 1"><br>
    <input type="number" id="sub2" placeholder="Subject 2"><br>
    <input type="number" id="sub3" placeholder="Subject 3"><br>
    <input type="number" id="sub4" placeholder="Subject 4"><br>
    <input type="number" id="sub5" placeholder="Subject 5"><br>
    <input type="number" id="sub6" placeholder="Subject 6"><br>
    <input type="number" id="sub7" placeholder="Subject 7"><br>
    <input type="number" id="sub8" placeholder="Subject 8"><br>
    <button id="calcMarksBtn" type="button">Calculate Total Marks</button>
    <p id="marksResult"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
